<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0e11">
<title>Generator mObywatel</title>
<style>
  :root {
    --bg: #0d0e11;
    --surface: #16191f;
    --text: #f3f4f6;
    --muted: #9ca3af;
    --blue: #3b82f6;
    --border: rgba(255, 255, 255, 0.1);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: antialiased;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
  }

  body {
    background: radial-gradient(circle at 20% 0%, #161e2e 0%, #0d0e11 55%);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    justify-content: center;
  }

  .wrap {
    width: 100%;
    max-width: 460px;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  .gen-header {
    padding: calc(env(safe-area-inset-top, 14px) + 14px) 20px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .app-icon-red {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: linear-gradient(155deg, #d81e3a 0%, #a51128 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
    box-shadow: 0 3px 10px rgba(216, 30, 58, 0.35);
    flex-shrink: 0;
  }

  .app-icon-red img { width: 100%; height: 100%; object-fit: contain; }

  .gen-body {
    flex: 1;
    padding: 16px 20px 28px;
    display: flex;
    flex-direction: column;
    gap: 13px;
  }

  .sec-title {
    font-size: 12px;
    font-weight: 700;
    color: #60a5fa;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-top: 6px;
  }

  .gen-grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .field-group label {
    display: block;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.35px;
    margin-bottom: 5px;
  }

  .field-group input,
  .field-group select {
    width: 100%;
    padding: 11px 12px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.13);
    background: var(--surface);
    color: #ffffff;
    font-size: 14px;
    outline: none;
  }

  .field-group input:focus,
  .field-group select:focus { border-color: var(--blue); }

  .pesel-row { display: flex; gap: 8px; }

  .pesel-row input {
    font-family: ui-monospace, "Consolas", monospace;
    font-weight: 700;
    letter-spacing: 1px;
    color: #60a5fa;
  }

  .btn-small {
    background: #232833;
    color: #e5e7eb;
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 0 14px;
    border-radius: 12px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }

  .photo-upload-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px dashed rgba(255, 255, 255, 0.24);
    border-radius: 14px;
    padding: 10px 12px;
    cursor: pointer;
  }

  .photo-thumb {
    width: 48px;
    height: 60px;
    border-radius: 9px;
    background: #0c0e12;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .photo-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(100%);
  }

  .gen-footer {
    padding: 14px 20px calc(env(safe-area-inset-bottom, 16px) + 16px);
    border-top: 1px solid var(--border);
    background: rgba(13, 14, 17, 0.96);
    backdrop-filter: blur(10px);
    position: sticky;
    bottom: 0;
  }

  .btn-launch {
    width: 100%;
    background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
    color: #ffffff;
    border: none;
    padding: 15px;
    border-radius: 14px;
    font-size: 15.5px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
  }

  .btn-launch:active { transform: scale(0.98); }

  .toast {
    position: fixed;
    bottom: 86px;
    left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: #2563eb;
    color: #fff;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: all 0.2s ease;
  }

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <div class="gen-header">
    <div class="app-icon-red">
      <img src="https://upload.wikimedia.org/wikipedia/commons/c/c9/Herb_Polski.svg" alt="RP">
    </div>
    <div>
      <div style="font-size:17px;font-weight:700;">Generator mObywatel</div>
      <div style="font-size:12px;color:#9ca3af;">Wypełnij dane i utwórz gotową apkę na telefon</div>
    </div>
  </div>

  <div class="gen-body">
    <div class="photo-upload-bar" onclick="document.getElementById('photoInput').click()">
      <div class="photo-thumb" id="genPhotoThumb">&#128247;</div>
      <div>
        <div style="font-size:14px;font-weight:600;">Zdjęcie do mDowodu</div>
        <div style="font-size:12px;color:#9ca3af;">Kliknij, aby wybrać z galerii telefonu</div>
      </div>
    </div>
    <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="handlePhoto(event)">

    <div class="sec-title">Dane podstawowe</div>
    <div class="gen-grid-2">
      <div class="field-group"><label>Imię (imiona)</label><input id="g-imie" type="text" placeholder="JAN"></div>
      <div class="field-group"><label>Nazwisko</label><input id="g-nazwisko" type="text" placeholder="KOWALSKI"></div>
    </div>

    <div class="gen-grid-2">
      <div class="field-group"><label>Data urodzenia</label><input id="g-urodzenie" type="text" placeholder="12.05.2006" oninput="autoGeneratePesel()"></div>
      <div class="field-group">
        <label>Płeć</label>
        <select id="g-plec" onchange="autoGeneratePesel()">
          <option value="Mężczyzna">Mężczyzna</option>
          <option value="Kobieta">Kobieta</option>
        </select>
      </div>
    </div>

    <div class="field-group">
      <label>Numer PESEL (auto)</label>
      <div class="pesel-row">
        <input id="g-pesel" type="text" readonly>
        <button type="button" class="btn-small" onclick="autoGeneratePesel(true)">Losuj</button>
      </div>
    </div>

    <div class="gen-grid-2">
      <div class="field-group"><label>Obywatelstwo</label><input id="g-obywatelstwo" type="text" placeholder="POLSKIE"></div>
      <div class="field-group"><label>Seria i numer</label><input id="g-seria" type="text" placeholder="ZZC 108291"></div>
    </div>

    <div class="gen-grid-2">
      <div class="field-group"><label>Data wydania</label><input id="g-wydanie" type="text" placeholder="14.08.2024"></div>
      <div class="field-group"><label>Termin ważności</label><input id="g-waznosc" type="text" placeholder="14.08.2034"></div>
    </div>

    <div class="sec-title">Rodzice i dane dodatkowe</div>
    <div class="gen-grid-2">
      <div class="field-group"><label>Imię ojca</label><input id="g-ojciec" type="text" placeholder="MAREK"></div>
      <div class="field-group"><label>Imię matki</label><input id="g-matka" type="text" placeholder="ANNA"></div>
    </div>

    <div class="gen-grid-2">
      <div class="field-group"><label>Nazwisko rodowe</label><input id="g-rodowe" type="text" placeholder="KOWALSKI"></div>
      <div class="field-group"><label>Miejsce urodzenia</label><input id="g-miejsce" type="text" placeholder="BIAŁYSTOK"></div>
    </div>

    <div class="gen-grid-2">
      <div class="field-group"><label>Nazwisko rodowe ojca</label><input id="g-rodoweOjca" type="text" placeholder="KOWALSKI"></div>
      <div class="field-group"><label>Nazwisko rodowe matki</label><input id="g-rodoweMatki" type="text" placeholder="NOWAK"></div>
    </div>

    <div class="gen-grid-2">
      <div class="field-group"><label>Kraj urodzenia</label><input id="g-kraj" type="text" placeholder="POLSKA"></div>
      <div class="field-group"><label>Data zameldowania</label><input id="g-dataZam" type="text" placeholder="02.09.2012"></div>
    </div>

    <div class="field-group"><label>Adres zameldowania na pobyt stały</label><input id="g-adres" type="text" placeholder="UL. LIPOWA 14/2, 15-427 BIAŁYSTOK"></div>
    <div class="field-group"><label>Organ wydający</label><input id="g-organ" type="text" placeholder="PREZYDENT MIASTA BIAŁEGOSTOKU"></div>
  </div>

  <div class="gen-footer">
    <button type="button" class="btn-launch" onclick="generateAndOpenApp()">Wygeneruj aplikację na telefon</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const DEFAULTS = {
    imie: "JAN",
    nazwisko: "KOWALSKI",
    obywatelstwo: "POLSKIE",
    urodzenie: "12.05.2006",
    pesel: "",
    seria: "ZZC 108291",
    waznosc: "14.08.2034",
    wydanie: "14.08.2024",
    ojciec: "MAREK",
    matka: "ANNA",
    rodowe: "KOWALSKI",
    rodoweOjca: "KOWALSKI",
    rodoweMatki: "NOWAK",
    plec: "Mężczyzna",
    miejsce: "BIAŁYSTOK",
    kraj: "POLSKA",
    dataZam: "02.09.2012",
    adres: "UL. LIPOWA 14/2, 15-427 BIAŁYSTOK",
    organ: "PREZYDENT MIASTA BIAŁEGOSTOKU",
    photo: ""
  };

  const FIELDS = Object.keys(DEFAULTS).filter(k => k !== "photo");
  let photoDataUrl = "";

  function computePesel(dateStr, plec) {
    const m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec((dateStr || "").trim());
    let day = 12, month = 5, year = 2006;
    if (m) {
      day = Math.max(1, Math.min(31, parseInt(m[1], 10)));
      month = Math.max(1, Math.min(12, parseInt(m[2], 10)));
      year = parseInt(m[3], 10);
    }
    const yy = String(year % 100).padStart(2, "0");
    let mmNum = month;
    if (year >= 2000 && year <= 2099) mmNum += 20;
    else if (year >= 2100 && year <= 2199) mmNum += 40;
    else if (year >= 1800 && year <= 1899) mmNum += 80;
    const mm = String(mmNum).padStart(2, "0");
    const dd = String(day).padStart(2, "0");

    const rand3 = String(Math.floor(Math.random() * 1000)).padStart(3, "0");
    const gDigits = plec === "Kobieta" ? [0, 2, 4, 6, 8] : [1, 3, 5, 7, 9];
    const gDigit = gDigits[Math.floor(Math.random() * gDigits.length)];

    const base10 = `${yy}${mm}${dd}${rand3}${gDigit}`;
    const w = [1, 3, 7, 9, 1, 3, 7, 9, 1, 3];
    let sum = 0;
    for (let i = 0; i < 10; i++) sum += parseInt(base10[i], 10) * w[i];
    const ctrl = (10 - (sum % 10)) % 10;
    return base10 + String(ctrl);
  }

  function autoGeneratePesel(notify = false) {
    const dob = document.getElementById("g-urodzenie").value;
    const plec = document.getElementById("g-plec").value;
    document.getElementById("g-pesel").value = computePesel(dob, plec);
    if (notify) showToast("Wylosowano nowy PESEL");
  }

  // Compact grayscale photo so it survives inside the URL hash cleanly for iOS/Android PWA install
  function handlePhoto(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const targetW = 190;
        const targetH = 244;
        const canvas = document.createElement("canvas");
        canvas.width = targetW;
        canvas.height = targetH;
        const ctx = canvas.getContext("2d");

        // Center-crop cover
        const scale = Math.max(targetW / img.width, targetH / img.height);
        const sw = targetW / scale;
        const sh = targetH / scale;
        const sx = (img.width - sw) / 2;
        const sy = (img.height - sh) / 2;

        ctx.filter = "grayscale(100%) contrast(106%)";
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, targetW, targetH);
        photoDataUrl = canvas.toDataURL("image/jpeg", 0.68);
        document.getElementById("genPhotoThumb").innerHTML = `<img src="${photoDataUrl}">`;
        showToast("Zdjęcie dodane");
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  function encodePayload(obj) {
    const json = JSON.stringify(obj);
    const bytes = new TextEncoder().encode(json);
    let bin = "";
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  function generateAndOpenApp() {
    const payload = { photo: photoDataUrl };
    for (const k of FIELDS) {
      const el = document.getElementById(`g-${k}`);
      if (el) payload[k] = el.value.trim();
    }
    if (!payload.pesel) payload.pesel = computePesel(payload.urodzenie, payload.plec);

    try {
      localStorage.setItem("mobywatel_app_data", JSON.stringify(payload));
    } catch {}

    const hash = encodePayload(payload);
    window.location.href = `./app.html#d=${hash}`;
  }

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(window._t);
    window._t = setTimeout(() => t.classList.remove("show"), 1500);
  }

  for (const k of FIELDS) {
    const el = document.getElementById(`g-${k}`);
    if (el) el.value = DEFAULTS[k];
  }
  autoGeneratePesel();
</script>
</body>
</html>
